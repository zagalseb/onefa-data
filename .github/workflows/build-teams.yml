name: Generar parquet de equipos

on:
  push:
    branches: [main]
    paths:
      - "data-raw/teams.csv"
      - "scripts/build_teams.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas pyarrow

      - name: Validar el CSV y generar el parquet
        run: python scripts/build_teams.py

      - name: Guardar el parquet si cambió
        run: |
          if [ -n "$(git status --porcelain teams/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add teams/onefa_teams.parquet
            git commit -m "Actualizar onefa_teams.parquet"
            git push
          else
            echo "El parquet no cambió, no hay nada que guardar."
          fi
